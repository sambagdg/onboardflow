name: CI

# Quand le workflow se déclenche
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Si tu pousses 2 fois de suite, la 1re exécution est annulée
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest

    steps:
      # 1. Récupérer le code du dépôt
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Installer Node, avec le cache npm pour accélérer les exécutions suivantes
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Installer les dépendances exactement comme dans package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Les trois vérifications que tu lances déjà en local
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1